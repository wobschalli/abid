# Plain YAML on purpose — sinatra-activerecord's rake tasks read this file
# directly. Environment overrides (DB_USER, DB_PASSWORD, DB_HOST, DB_PORT,
# DB_NAME, DATABASE_URL) are applied in Ruby by Abid.database_config.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5
  username: postgres
  password: password
  host: localhost
  port: 5432

development:
  <<: *default
  database: abid_development

test:
  <<: *default
  database: abid_test

production:
  <<: *default
  database: abid_production
