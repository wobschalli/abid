# Connection settings come from the environment so the same image can run
# locally (defaults below) and in Docker/production (env vars from .env).
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('DB_POOL', 5) %>
  host: <%= ENV.fetch('DB_HOST', 'localhost') %>
  port: <%= ENV.fetch('DB_PORT', 5432) %>
  username: <%= ENV.fetch('DB_USER', 'postgres') %>
  password: <%= ENV.fetch('DB_PASSWORD', 'password') %>

development:
  <<: *default
  database: <%= ENV.fetch('DB_NAME', 'abid_development') %>

test:
  <<: *default
  database: <%= ENV.fetch('DB_NAME', 'abid_test') %>

production:
  <<: *default
  database: <%= ENV.fetch('DB_NAME', 'abid_production') %>
