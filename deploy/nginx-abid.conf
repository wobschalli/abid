# /etc/nginx/sites-available/abid — TLS in front of puma on 127.0.0.1:5544.
# The dashboard lives under /abidebot/ so the domain root stays free for
# something else. Replace RIDES_HOSTNAME with the real domain, then:
#   sudo ln -s /etc/nginx/sites-available/abid /etc/nginx/sites-enabled/abid
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d RIDES_HOSTNAME     # adds the HTTPS server block
#
# The dashboard holds ~80 members' phone numbers and home addresses. It is
# never served over plain HTTP: certbot rewrites this block to redirect 80 -> 443.
server {
    listen 80;
    listen [::]:80;
    server_name RIDES_HOSTNAME;

    # Let's Encrypt HTTP-01 challenge.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # The bare root has nothing yet; send people to the app.
    location = / { return 302 /abidebot/; }
    location = /abidebot { return 301 /abidebot/; }

    # No URI part on proxy_pass: the full /abidebot/... path is forwarded and
    # the app (mounted at ABID_ROOT_PATH=/abidebot) strips it itself, so every
    # link, redirect and asset it generates already carries the prefix.
    location /abidebot/ {
        proxy_pass http://127.0.0.1:5544;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
