# /etc/nginx/sites-available/abid — TLS in front of puma (unix socket).
# The dashboard lives under /abidebot/ so the domain root stays free.
# deploy/install.sh installs this once, then certbot adds the TLS blocks and
# later runs only patch the location blocks in place.
#
# The dashboard holds ~80 members' phone numbers and home addresses. It is
# never served over plain HTTP: certbot rewrites this block to redirect 80 -> 443.
upstream puma_abid {
    server unix:/opt/abid/tmp/sockets/abid-web.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name RIDES_HOSTNAME;

    # Let's Encrypt HTTP-01 challenge.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # The bare root has nothing yet; send people to the app.
    location = / { return 302 /abidebot/; }
    location = /abidebot { return 301 /abidebot/; }

    # No URI part on proxy_pass: the full /abidebot/... path is forwarded and
    # the app (mounted at ABID_ROOT_PATH=/abidebot) strips it itself, so every
    # link, redirect and asset it generates already carries the prefix.
    location /abidebot/ {
        proxy_pass http://puma_abid;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
